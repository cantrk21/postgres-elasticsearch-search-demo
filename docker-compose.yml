name: es-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: es_test
      POSTGRES_PASSWORD: es_test_local
      POSTGRES_DB: es_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U es_test -d es_test"]
      interval: 5s
      timeout: 5s
      retries: 30
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9201:9200"
    mem_limit: 2g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
volumes:
  postgres-data:
  elasticsearch-data:
